name: Phase 2 audit repair PR driver

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2-audit-repair-pr.yml

permissions:
  contents: write
  issues: write

jobs:
  apply-repairs:
    if: github.head_ref == 'agent/phase2-implementation-audit-prep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-implementation-audit-prep
          fetch-depth: 0

      - name: Extract and apply the repair script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/phase2-audit-repair.yml').read_text(
              encoding='utf-8'
          ).splitlines()
          start = next(
              index
              for index, line in enumerate(source)
              if line.strip() == "python - <<'PY'"
          ) + 1
          end = next(
              index
              for index in range(start, len(source))
              if source[index].strip() == 'PY'
          )
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in source[start:end]
          ) + '\n'
          compile(script, '<phase2-audit-repair>', 'exec')
          Path('/tmp/phase2_audit_repair.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/phase2_audit_repair.py

      - name: Compile generated repairs or report exact lines
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m compileall -q src tests > /tmp/compile.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '## Generated repair syntax diagnostics'
              echo
              echo 'No repair commit was pushed.'
              echo
              echo '```text'
              cat /tmp/compile.log
              echo '--- dispatch lines 742-760 ---'
              nl -ba src/sudachi_life/phase2_dispatch_runtime.py | sed -n '742,760p' | cat -vet
              echo '--- repair test lines 178-194 ---'
              nl -ba tests/test_phase2_implementation_audit_repairs.py | sed -n '178,194p' | cat -vet
              echo '```'
            } > /tmp/failure.md
            gh issue comment 121 --repo yo4e/sudachi-life --body-file /tmp/failure.md
            exit 1
          fi

      - name: Run repaired protected suite
        shell: bash
        run: |
          python -m pip install --quiet -e ".[dev]"
          pytest -q --tb=short

      - name: Commit only the green repair candidate
        shell: bash
        run: |
          rm .github/workflows/phase2-audit-repair.yml
          rm .github/workflows/phase2-audit-repair-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Phase 2 implementation audit findings"
          git push origin HEAD:agent/phase2-implementation-audit-prep

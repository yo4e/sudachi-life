name: Phase 2 audit repair PR driver

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2-audit-repair-pr.yml
      - .github/phase2_audit_repair.py

permissions:
  contents: write
  issues: write

jobs:
  apply-repairs:
    if: github.head_ref == 'agent/phase2-implementation-audit-prep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-implementation-audit-prep
          fetch-depth: 0

      - name: Apply accepted audit repairs or report precondition failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i 's/dfda290b508dba16c802f084f564f1d8a8c68d0e/ed573180a7017b9ec8b1002ec59f2376e90653ee8a4013f8b24775a80a0f80ac/g' .github/phase2_audit_repair.py
          set +e
          python .github/phase2_audit_repair.py > /tmp/apply.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '## Standalone repair precondition failure'
              echo
              echo 'No generated repair was committed.'
              echo
              echo '```text'
              cat /tmp/apply.log
              echo '```'
            } > /tmp/apply.md
            gh issue comment 121 --repo yo4e/sudachi-life --body-file /tmp/apply.md
            exit 1
          fi

      - name: Compile repaired source and tests or report failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m compileall -q src tests > /tmp/compile.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo '## Standalone repair compile failure'
              echo
              echo 'No generated repair was committed.'
              echo
              echo '```text'
              cat /tmp/compile.log
              echo '```'
            } > /tmp/compile.md
            gh issue comment 121 --repo yo4e/sudachi-life --body-file /tmp/compile.md
            exit 1
          fi

      - name: Install and run repaired protected suite
        shell: bash
        run: |
          python -m pip install --quiet -e ".[dev]"
          pytest -q --tb=short | tee /tmp/pytest.log

      - name: Commit only the green repair candidate
        shell: bash
        run: |
          rm .github/phase2_audit_repair.py
          rm .github/workflows/phase2-audit-repair.yml
          rm .github/workflows/phase2-audit-repair-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Phase 2 implementation audit findings"
          git push origin HEAD:agent/phase2-implementation-audit-prep

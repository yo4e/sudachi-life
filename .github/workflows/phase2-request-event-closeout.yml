name: Phase 2 request-event durable closeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  closeout:
    if: github.head_ref == 'agent/phase2-implementation-audit-prep'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-implementation-audit-prep
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply durable evidence synchronization
        run: |
          set -euo pipefail
          python .github/phase2_request_event_closeout.py
          changed="$(git diff --name-only)"
          expected=$'AGENTS.md\ndocs/HANDOFF.md\ndocs/phase2/PHASE2_IMPLEMENTATION_EVIDENCE_MAP.md\ndocs/phase2/SLICE42C_FINAL_CLOSURE_AUDIT.md\ndocs/phase2/SLICE42C_IMPLEMENTATION_AUDIT_REPAIRS.md'
          if [ "$changed" != "$expected" ]; then
            printf 'unexpected changed files:\n%s\n' "$changed"
            exit 1
          fi

      - name: Compile source and tests
        run: |
          set -euo pipefail
          python -m compileall -q src tests

      - name: Install package and pytest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run protected suite strictly
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/phase2-request-event-closeout-pytest.txt

      - name: Preserve repair-local Phase 1 boundary
        run: |
          set -euo pipefail
          git diff --exit-code -- 'tests/test_phase1*.py' 'tests/phase1_audit_helpers.py'

      - name: Commit only green durable state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/phase2_request_event_closeout.py
          git rm .github/workflows/phase2-request-event-closeout.yml
          git add -A
          git commit -m 'Document request-event semantic repair'
          git push origin HEAD:agent/phase2-implementation-audit-prep

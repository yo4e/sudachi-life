name: Phase 2 freeze closeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  closeout:
    if: github.head_ref == 'agent/phase2-freeze-closeout'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-freeze-closeout
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply docs-only freeze synchronization
        run: |
          set -euo pipefail
          python .github/phase2_freeze_closeout.py
          changed="$(git diff --name-only)"
          expected=$'AGENTS.md\ndocs/HANDOFF.md\ndocs/phase2/PHASE2_IMPLEMENTATION_EVIDENCE_MAP.md\ndocs/phase2/SLICE42C_FINAL_CLOSURE_AUDIT.md'
          if [ "$changed" != "$expected" ]; then
            printf 'unexpected durable changes:\n%s\n' "$changed"
            exit 1
          fi
          git diff --exit-code b0941a8ba2a178fc891839198cd5dd5bf6e87719 -- src tests

      - name: Compile source and tests
        run: |
          set -euo pipefail
          python -m compileall -q src tests

      - name: Install package and pytest
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run frozen protected suite
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/phase2-freeze-pytest.txt
          grep -Eq '395 passed in [0-9.]+s' /tmp/phase2-freeze-pytest.txt

      - name: Commit only green durable closeout
        run: |
          set -euo pipefail
          rm .github/phase2_freeze_closeout.py
          rm .github/workflows/phase2-freeze-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          staged="$(git diff --cached --name-only)"
          expected=$'.github/phase2_freeze_closeout.py\n.github/workflows/phase2-freeze-closeout.yml\nAGENTS.md\ndocs/HANDOFF.md\ndocs/phase2/PHASE2_IMPLEMENTATION_EVIDENCE_MAP.md\ndocs/phase2/SLICE42C_FINAL_CLOSURE_AUDIT.md'
          if [ "$staged" != "$expected" ]; then
            printf 'unexpected staged files:\n%s\n' "$staged"
            exit 1
          fi
          git commit -m 'Record final Phase 2 freeze'
          git push origin HEAD:agent/phase2-freeze-closeout

name: Agent source snapshot

on:
  push:
    branches:
      - agent/slice36-schema-v2-genesis
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source snapshot
        run: |
          tar -czf sudachi-source.tar.gz src tests pyproject.toml .github/workflows/test.yml
      - uses: actions/upload-artifact@v4
        with:
          name: sudachi-source
          path: sudachi-source.tar.gz
          if-no-files-found: error

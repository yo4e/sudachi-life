name: Agent source snapshot

on:
  push:
    branches:
      - agent/slice36-schema-v2-genesis
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create tracked-tree snapshot
        run: |
          git ls-files -z | tar --null -czf sudachi-source.tar.gz -T -
      - uses: actions/upload-artifact@v4
        with:
          name: sudachi-source
          path: sudachi-source.tar.gz
          if-no-files-found: error

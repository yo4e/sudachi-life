name: Phase 2 request-event semantics repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/phase2-implementation-audit-prep'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-implementation-audit-prep
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply narrow Phase 2 repair
        run: |
          set -euo pipefail
          python .github/phase2_request_event_semantics_repair.py
          python .github/phase2_request_event_semantics_followup.py
          changed="$(git diff --name-only)"
          expected=$'src/sudachi_life/phase2_dispatch_runtime.py\ntests/test_phase2_implementation_audit_repairs.py'
          if [ "$changed" != "$expected" ]; then
            printf 'unexpected changed files:\n%s\n' "$changed"
            exit 1
          fi

      - name: Compile source and tests
        run: |
          set -euo pipefail
          python -m compileall -q src tests

      - name: Install package and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run protected suite strictly
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/phase2-request-event-pytest.txt

      - name: Preserve Phase 1 blob boundary
        run: |
          set -euo pipefail
          changed_phase1="$(git diff --name-only 62c9e0c6ba7e33eee85e1687b8bf6a3978a25338 -- 'tests/test_phase1*.py' 'tests/phase1_audit_helpers.py')"
          if [ -n "$changed_phase1" ]; then
            printf 'Phase 1 test/helper changes detected:\n%s\n' "$changed_phase1"
            exit 1
          fi

      - name: Commit only the green repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/phase2_request_event_semantics_repair.py
          rm .github/phase2_request_event_semantics_followup.py
          rm .github/workflows/phase2-request-event-semantics-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sudachi_life/phase2_dispatch_runtime.py tests/test_phase2_implementation_audit_repairs.py
          git commit -m 'Bind exact request-created event semantics'
          git push origin HEAD:agent/phase2-implementation-audit-prep

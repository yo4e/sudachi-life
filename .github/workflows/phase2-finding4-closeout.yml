name: Phase 2 Finding 4 closeout

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/phase2_finding4_closeout.py
      - .github/workflows/phase2-finding4-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    if: github.head_ref == 'agent/phase2-implementation-audit-prep'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-implementation-audit-prep
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply durable closeout updates
        run: python .github/phase2_finding4_closeout.py

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Install package and test dependencies
        run: python -m pip install --quiet -e '.[dev]'

      - name: Run protected suite strictly
        shell: bash
        run: |
          set -o pipefail
          pytest -q --tb=short | tee /tmp/pytest.log

      - name: Commit only green durable state
        run: |
          rm .github/phase2_finding4_closeout.py
          rm .github/workflows/phase2-finding4-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record final Phase 2 checkpoint linkage repair'
          git push origin HEAD:agent/phase2-implementation-audit-prep
